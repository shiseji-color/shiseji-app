<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>获取与使用规则｜拾色季</title>
  <style>
    :root { color-scheme: light; --ink:#4a403a; --muted:#6f6058; --line:#e8ddd7; --paper:#fbf8f4; --accent:#755044; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:#f6f2ed; font-family:"Noto Sans SC","Microsoft YaHei",sans-serif; }
    main { width:min(100% - 32px, 620px); margin:56px auto; padding:44px 40px 48px; border:1px solid var(--line); border-radius:28px; background:rgba(255,255,255,.78); box-shadow:0 24px 60px rgba(74,64,58,.09); }
    .brand { margin:0; font-family:"Songti SC","STSong",serif; font-size:28px; font-weight:400; letter-spacing:.28em; text-align:center; }
    .eyebrow { margin:10px 0 40px; color:#76665e; font-size:11px; letter-spacing:.18em; text-align:center; }
    h1 { margin:0 0 28px; font-family:"Songti SC","STSong",serif; font-size:28px; font-weight:400; letter-spacing:.08em; }
    section { padding:22px 0; border-top:1px solid var(--line); }
    h2 { margin:0 0 12px; font-size:15px; font-weight:700; letter-spacing:.03em; }
    p, li { color:var(--muted); font-size:14px; line-height:2.05; }
    p { margin:0; }
    ul { margin:0; padding:0; list-style:none; }
    li { position:relative; padding-left:18px; }
    li::before { content:""; position:absolute; left:0; top:1em; width:8px; height:1px; background:#c7aea3; }
    .actions { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:26px; }
    .back { display:inline-flex; align-items:center; min-height:44px; color:var(--accent); font-size:14px; text-decoration-color:rgba(117,80,68,.32); text-underline-offset:4px; }
    @media (max-width:560px) { main { margin:20px auto; padding:36px 24px 40px; border-radius:24px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">拾色季</p>
    <p class="eyebrow">COLOR SEASON</p>
    <h1>获取与使用规则</h1>
    <section>
      <h2>获取专属密钥</h2>
      <p>专属密钥由提供拾色季服务的店铺发放。如尚未获取密钥，请联系购买服务的店铺。</p>
    </section>
    <section>
      <h2>使用规则</h2>
      <ul>
        <li>每成功生成一份有效色彩档案消耗 1 次。</li>
        <li>照片不合格或分析失败时，本次使用次数将返还。</li>
        <li>妆发与穿搭效果图不额外消耗密钥次数。</li>
      </ul>
    </section>
    <section>
      <h2>使用说明</h2>
      <p>首页中的色彩档案为演示示例，实际结果因人而异。分析结果用于个人色彩与造型参考，不构成医疗或专业诊断。不同设备的屏幕显示可能造成轻微色差。</p>
    </section>
    <nav class="actions" aria-label="相关页面">
      <a class="back" href="index.html">返回首页</a>
      <a class="back" href="privacy-policy.html">完整隐私说明与删除申请</a>
    </nav>
  </main>
</body>
</html>
